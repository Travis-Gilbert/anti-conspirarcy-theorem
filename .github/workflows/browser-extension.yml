name: Browser Extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: anti-conspirarcy-theorem-extension
          path: browser-extension/release/anti-conspirarcy-theorem-extension.zip
