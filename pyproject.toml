[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theseus-acc"
version = "0.2.0"
description = "Anti-Conspiracy Constraint (ACC) for epistemic integrity scoring over NetworkX graphs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Theseus Labs"}
]
dependencies = [
  "networkx>=3.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
benchmarks = [
  "pyclugen>=0.8.0",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["theseus_acc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
